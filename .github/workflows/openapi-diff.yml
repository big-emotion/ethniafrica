name: OpenAPI — Breaking-change diff

on:
  # Both integration targets, not just main. Gating only `main` meant a
  # breaking API change merged into `recette` went undiffed until the release
  # PR, by which point it sat several merges deep and the diff named the wrong
  # change as the culprit.
  pull_request:
    branches: [main, recette]

# Superseded runs of the same branch are cancelled.
concurrency:
  group: openapi-diff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diff:
    name: openapi-diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate current spec (PR)
        run: npx tsx scripts/generate-openapi-spec.ts /tmp/current.json

      - name: Generate baseline spec (base ref)
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "$BASE_REF"

          # The spec has two halves, and a baseline needs both of them at the
          # base ref. `openapiV2.ts` carries the static `paths` object;
          # swagger-jsdoc scans `./src/app/api/v2/**/*.ts` for the `@swagger`
          # blocks describing the other ~31 routes. Swapping only the first file
          # left the baseline reading the *PR's* route tree, so deleting a route
          # or editing its JSDoc changed both specs identically and diffed to
          # nothing: the gate could only ever see the static half.
          if git show "origin/${BASE_REF}:src/lib/api/openapiV2.ts" > /dev/null 2>&1; then
            git checkout "origin/${BASE_REF}" -- src/lib/api/openapiV2.ts src/app/api/v2
            npx tsx scripts/generate-openapi-spec.ts /tmp/baseline.json

            # The tree has to go back before the diff step, which imports
            # swaggerSpecV2 from the live tree to build the *current* spec —
            # leaving base's routes in place would compare base against base.
            # `reset --hard` rather than `checkout HEAD --`: the pathspec
            # checkout above stages base's files, including any this PR deleted,
            # and only a hard reset drops those from index and worktree alike.
            # Safe because this job's checkout carries no other local changes;
            # do not copy this line into a working tree that does.
            git reset --hard HEAD --quiet
            git clean -fdq src/app/api/v2
          else
            echo "::notice::No baseline openapiV2.ts on origin/${BASE_REF} — skipping diff."
            echo '{}' > /tmp/baseline.json
          fi

      - name: Diff specs (fail on breaking changes)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Honor `api-breaking: true` trailer in PR title or body, in addition
          # to the commit-message check the script already performs.
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -qiE '^api-breaking:[[:space:]]*true'; then
            export API_BREAKING=true
            echo "::notice::api-breaking: true detected in PR — allowing breaking changes."
          fi
          npx tsx scripts/openapi-diff.ts /tmp/baseline.json
