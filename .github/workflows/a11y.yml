name: A11y — axe-core

on:
  # A required check on both branches, and the one that sets how long a pull
  # request takes to become mergeable — so it stays pre-merge. The `push` on
  # main was dropped for the reason ci.yml and data-integrity.yml already give
  # for themselves: every change reaches main through a pull request, so the
  # post-merge run re-audited an identical tree and nothing read its result.
  pull_request:
    branches: [recette, main]

# Superseded runs of the same branch are cancelled. Without this a branch pushed
# three times kept three generations of a ~13 min audit competing for runners,
# which is what turned a busy afternoon of parallel pull requests into a queue.
concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  axe:
    name: axe-core (Storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Storybook
        run: npm run build-storybook

      # Same Playwright version, same browser build, downloaded fresh on every
      # run: 54 s of the job was re-fetching bytes it already had. Keyed on the
      # lockfile so a version bump misses the cache and refetches, as it should.
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Skip cleanly on forks / Dependabot PRs that cannot access the Supabase
      # secrets — the Storybook-only axe check above still runs and gates.
      # Mirrors .github/workflows/lighthouse.yml.
      - name: Check required secrets are present
        id: secrets
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping live-route a11y audit (/fr/noms, dossier fiche) — NEXT_PUBLIC_SUPABASE_URL secret not available (fork or Dependabot PR)."
          fi

      # Same artefact ci.yml already builds for this commit: restoring it takes
      # the build from ~45 s to ~11 s. .next/cache is content-hashed by Next, so
      # a stale entry is ignored rather than mis-served.
      - name: Restore Next.js build cache
        if: steps.secrets.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js app
        if: steps.secrets.outputs.present == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Epic 10, Story 10.11 (ETNI-500) — /fr/quiz 404s (isQuizFeatureEnabled)
          # unless this is set, which would silently audit nothing.
          NEXT_PUBLIC_FEATURE_QUIZ: "true"

      - name: Start Next.js server
        if: steps.secrets.outputs.present == 'true'
        run: npm run start &
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_FEATURE_QUIZ: "true"

      - name: Wait for server to be ready
        if: steps.secrets.outputs.present == 'true'
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run axe-core checks
        run: npx tsx scripts/a11y-test.ts
        env:
          A11Y_LIVE_BASE_URL: ${{ steps.secrets.outputs.present == 'true' && 'http://localhost:3000' || '' }}
