name: A11y — axe-core

on:
  pull_request:
    branches: [recette, main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  axe:
    name: axe-core (Storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Skip cleanly on forks / Dependabot PRs that cannot access the Supabase
      # secrets — the Storybook-only axe check above still runs and gates.
      # Mirrors .github/workflows/lighthouse.yml.
      - name: Check required secrets are present
        id: secrets
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping live-route a11y audit (/fr/noms, dossier fiche) — NEXT_PUBLIC_SUPABASE_URL secret not available (fork or Dependabot PR)."
          fi

      - name: Build Next.js app
        if: steps.secrets.outputs.present == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Start Next.js server
        if: steps.secrets.outputs.present == 'true'
        run: npm run start &
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Wait for server to be ready
        if: steps.secrets.outputs.present == 'true'
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run axe-core checks
        run: npx tsx scripts/a11y-test.ts
        env:
          A11Y_LIVE_BASE_URL: ${{ steps.secrets.outputs.present == 'true' && 'http://localhost:3000' || '' }}
