name: Lighthouse CI — Mobile Performance

on:
  # Two jobs on two paths, the same split as e2e.yml.
  #
  # `gate` runs on every pull request, into `recette` included, and is meant to
  # be a required check: four routes, one run each, asserting accessibility and
  # best practices as errors and printing performance as warnings (see
  # `.lighthouserc.gate.js` for why the performance half cannot block here).
  #
  # `lighthouse` is the full matrix: 29 URLs × 3 runs, ~16 minutes. It used to
  # run on every pull request into `recette`, blocked nothing and was red 32
  # runs out of 32, so it moved to the integrated branch — nightly, on the
  # promotion into `main`, and on demand — where its budgets are now set to
  # what that branch measures (see `.lighthouserc.js`).
  pull_request:
    branches: [main, recette]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A push supersedes the audit still running for the previous commit.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Lighthouse gate (4 routes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Test-only publication: production remains fail-closed to fr-only.
      SITE_LOCALE_MODE: bilingual-fr-default
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_FEATURE_QUIZ: "true"
      # A test deployment: without Upstash credentials a production one
      # answers 500 on every /api/v2 call, and the console errors that follow
      # are exactly what the best-practices category reads.
      VERCEL_ENV: preview

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # A fork or bot PR cannot read repository secrets, so it skips. Anywhere
      # else a missing secret fails the job: a required check that reports
      # success without having audited anything is worse than a red one.
      - name: Check required secrets are present
        id: secrets
        env:
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork || false }}
          IS_BOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK_PR" = "true" ] || [ "$IS_BOT" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the Lighthouse gate — a fork or bot PR cannot read repository secrets."
          else
            echo "::error::No Supabase URL and anon key reached this job, so the Lighthouse gate cannot run. Set NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY to arm it."
            exit 1
          fi

      - name: Restore Next.js build cache
        if: steps.secrets.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js app
        if: steps.secrets.outputs.present == 'true'
        run: npm run build

      - name: Start Next.js server
        if: steps.secrets.outputs.present == 'true'
        run: npm run start &

      - name: Wait for server to be ready
        if: steps.secrets.outputs.present == 'true'
        run: npx wait-on http://localhost:3000 --timeout 60000

      # Pinned: an unpinned global install is a different auditor on the day a
      # release changes an audit's scoring, and the gate would move with it.
      - name: Install @lhci/cli
        if: steps.secrets.outputs.present == 'true'
        run: npm install -g @lhci/cli@0.15.1 --legacy-peer-deps

      - name: Install Chromium for Lighthouse
        if: steps.secrets.outputs.present == 'true'
        run: |
          npx playwright install --with-deps chromium
          node -e 'console.log("CHROME_PATH=" + require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"

      - name: Run the Lighthouse gate
        if: steps.secrets.outputs.present == 'true'
        run: lhci autorun --config=./.lighthouserc.gate.js

  lighthouse:
    name: Lighthouse Mobile Audit
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Test-only publication: production remains fail-closed to fr-only.
      SITE_LOCALE_MODE: bilingual-fr-default
      # A test deployment — see the gate job above.
      VERCEL_ENV: preview

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A scheduled event always fires against the default branch, which is
          # `main`. The nightly run is here to measure the integration branch,
          # so it has to name it: without this the board would show a green
          # nightly for `main` while `recette` went unmeasured.
          ref: ${{ github.event_name == 'schedule' && 'recette' || '' }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Epic 10, Story 10.11 (ETNI-500 · NFR18–NFR23, AR20) — a standalone
      # esbuild bundle of the quiz play-island entry, so this needs neither
      # Supabase secrets nor the full Next.js build below and always runs,
      # including on forks / Dependabot PRs.
      - name: Check quiz play-island bundle size (≤ 15 KB gzipped)
        run: npm run bundle-size:quiz

      # The home's two WebGL islands, measured the same standalone way: the
      # hero globe (DEC-020, 170 KB) and the axis panels' link graph
      # (REQ-114, 25 KB). The globe's budget script has existed since
      # ETNI-1214 without ever being run by CI — a cap nothing enforces is
      # an estimate, so both are wired here rather than only the new one.
      - name: Check home WebGL island bundle sizes
        run: |
          npm run bundle-size:home-globe
          npm run bundle-size:axis-graph

      # Skip cleanly on forks / Dependabot PRs that cannot access the Supabase
      # secrets. When the secret is set (i.e. on PRs from the same repo) the
      # gate is enforced — no continue-on-error masks failures.
      - name: Check required secrets are present
        id: secrets
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Lighthouse — NEXT_PUBLIC_SUPABASE_URL secret not available (fork or Dependabot PR)."
          fi

      - name: Build Next.js app
        if: steps.secrets.outputs.present == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Epic 10, Story 10.11 (ETNI-500) — the quiz route 404s
          # (isQuizFeatureEnabled) unless this is set, which would silently
          # audit nothing.
          NEXT_PUBLIC_FEATURE_QUIZ: "true"

      - name: Start Next.js server
        if: steps.secrets.outputs.present == 'true'
        run: npm run start &
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_FEATURE_QUIZ: "true"

      - name: Wait for server to be ready
        if: steps.secrets.outputs.present == 'true'
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Install @lhci/cli
        if: steps.secrets.outputs.present == 'true'
        run: npm install -g @lhci/cli@0.15.1 --legacy-peer-deps

      - name: Install Chromium for Lighthouse
        if: steps.secrets.outputs.present == 'true'
        run: |
          npx playwright install --with-deps chromium
          node -e 'console.log("CHROME_PATH=" + require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"

      - name: Run Lighthouse CI
        id: lhci
        if: steps.secrets.outputs.present == 'true'
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Comment Lighthouse report on PR
        if: always() && github.event_name == 'pull_request' && steps.secrets.outputs.present == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            let publicLinks = '';
            try {
              const linksPath = '.lighthouseci/links.json';
              if (fs.existsSync(linksPath)) {
                const links = JSON.parse(fs.readFileSync(linksPath, 'utf8'));
                const entries = Object.entries(links)
                  .map(([url, reportUrl]) => `- [${url}](${reportUrl})`)
                  .join('\n');
                publicLinks = entries
                  ? '\n\n**Public report URLs:**\n' + entries
                  : '';
              }
            } catch (e) {
              console.log('Could not read links.json:', e.message);
            }

            // Read off the config rather than typed here: the hand-kept copy
            // listed four retired addresses and called a route unaudited that
            // the config had measured for months. github-script runs from the
            // checkout root, which is where the relative require resolves.
            const routes = require('./.lighthouserc.js').ci.collect.url
              .map((url) => '- `' + new URL(url).pathname + '`')
              .join('\n');

            const outcome = '${{ steps.lhci.outcome }}';
            const status = outcome === 'success' ? '✅ Passed' : '❌ Failed';
            const body = [
              '## Lighthouse CI — Mobile Performance ' + status,
              '',
              '**Budgets:** see `.lighthouserc.js` — accessibility = 100 and best practices ≥ 95 everywhere; performance, LCP and TBT per route regime.',
              '',
              '**Routes audited:**',
              routes,
              publicLinks,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
