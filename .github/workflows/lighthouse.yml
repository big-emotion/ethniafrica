name: Lighthouse CI — Mobile Performance

on:
  # This audit is not a required check on either branch, and 32 of its last 32
  # runs were red. On every pull request into `recette` it spent ~16 minutes
  # measuring 21 URLs × 3 runs and blocked nothing — roughly 8 h of runner time
  # a day whose only visible effect was a pull request page that could not turn
  # green. A budget nobody can act on is not a gate, it is noise, and thirty-two
  # consecutive reds is how a real regression would now go unnoticed.
  #
  # Mobile performance is a property of the integrated branch rather than of any
  # single pull request, so it is measured where that statement is true: nightly
  # against `recette`, on the (rare) promotion into `main`, and on demand.
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A push supersedes the audit still running for the previous commit.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse Mobile Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A scheduled event always fires against the default branch, which is
          # `main`. The nightly run is here to measure the integration branch,
          # so it has to name it: without this the board would show a green
          # nightly for `main` while `recette` went unmeasured.
          ref: ${{ github.event_name == 'schedule' && 'recette' || '' }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Epic 10, Story 10.11 (ETNI-500 · NFR18–NFR23, AR20) — a standalone
      # esbuild bundle of the quiz play-island entry, so this needs neither
      # Supabase secrets nor the full Next.js build below and always runs,
      # including on forks / Dependabot PRs.
      - name: Check quiz play-island bundle size (≤ 15 KB gzipped)
        run: npm run bundle-size:quiz

      # The home's two WebGL islands, measured the same standalone way: the
      # hero globe (DEC-020, 170 KB) and the axis panels' link graph
      # (REQ-114, 25 KB). The globe's budget script has existed since
      # ETNI-1214 without ever being run by CI — a cap nothing enforces is
      # an estimate, so both are wired here rather than only the new one.
      - name: Check home WebGL island bundle sizes
        run: |
          npm run bundle-size:home-globe
          npm run bundle-size:axis-graph

      # Skip cleanly on forks / Dependabot PRs that cannot access the Supabase
      # secrets. When the secret is set (i.e. on PRs from the same repo) the
      # gate is enforced — no continue-on-error masks failures.
      - name: Check required secrets are present
        id: secrets
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Lighthouse — NEXT_PUBLIC_SUPABASE_URL secret not available (fork or Dependabot PR)."
          fi

      - name: Build Next.js app
        if: steps.secrets.outputs.present == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Epic 10, Story 10.11 (ETNI-500) — /fr/quiz 404s (isQuizFeatureEnabled)
          # unless this is set, which would silently audit nothing.
          NEXT_PUBLIC_FEATURE_QUIZ: "true"

      - name: Start Next.js server
        if: steps.secrets.outputs.present == 'true'
        run: npm run start &
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_FEATURE_QUIZ: "true"

      - name: Wait for server to be ready
        if: steps.secrets.outputs.present == 'true'
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Install @lhci/cli
        if: steps.secrets.outputs.present == 'true'
        run: npm install -g @lhci/cli --legacy-peer-deps

      - name: Install Chromium for Lighthouse
        if: steps.secrets.outputs.present == 'true'
        run: |
          npx playwright install --with-deps chromium
          node -e 'console.log("CHROME_PATH=" + require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"

      - name: Run Lighthouse CI
        id: lhci
        if: steps.secrets.outputs.present == 'true'
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Comment Lighthouse report on PR
        if: always() && github.event_name == 'pull_request' && steps.secrets.outputs.present == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            let publicLinks = '';
            try {
              const linksPath = '.lighthouseci/links.json';
              if (fs.existsSync(linksPath)) {
                const links = JSON.parse(fs.readFileSync(linksPath, 'utf8'));
                const entries = Object.entries(links)
                  .map(([url, reportUrl]) => `- [${url}](${reportUrl})`)
                  .join('\n');
                publicLinks = entries
                  ? '\n\n**Public report URLs:**\n' + entries
                  : '';
              }
            } catch (e) {
              console.log('Could not read links.json:', e.message);
            }

            const outcome = '${{ steps.lhci.outcome }}';
            const status = outcome === 'success' ? '✅ Passed' : '❌ Failed';
            const body = [
              '## Lighthouse CI — Mobile Performance ' + status,
              '',
              '**Thresholds:** Performance ≥ 85 | Accessibility = 100 | Best Practices ≥ 95',
              '',
              '**Routes audited:**',
              '- `/`',
              '- `/fr`',
              '- `/fr/peuples`',
              '- `/fr/recherche`',
              '- `/fr/mentions-legales`',
              '- `/fr/admin/connexion`',
              '- `/fr/pays/SEN`',
              '- `/fr/peuples/PPL_WOLOF`',
              '- `/fr/familles/FLG_BANTU`',
              '- `/fr/peuples/PPL_WOLOF/liens`',
              '- `/fr/comparer`',
              '- `/fr/comparer/peuples/PPL_WOLOF/PPL_SERERE`',
              '- `/fr/quiz`',
              '',
              '_Not audited: `/fr/noms`, `/fr/migrations` — both currently return HTTP 500 in CI, unrelated to this PR._',
              publicLinks,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
