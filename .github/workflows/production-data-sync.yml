name: Production AFRIK Data Sync

# Chained to the OVH deploy, not to a Vercel deployment_status. Production left Vercel,
# so `vercel[bot]` will never create a deployment for it again and this workflow would
# simply have stopped running — silently, with a green board and a corpus frozen at
# whatever the last Vercel deploy loaded.
#
# workflow_run only fires for a workflow file that lives on the default branch, so this
# file has to reach `main` for the chain to work at all; on `recette` alone it is inert.
#
# workflow_dispatch exists because the corpus and the quiz bank can fall behind production
# without a deploy to carry them there — a bank left empty between two releases is a hub
# entry that reads "Bientôt" for weeks. The same reason applies to the dispatch trigger as
# to workflow_run: GitHub only offers it for a file on the default branch.
on:
  workflow_run:
    workflows: ["Deploy Production (OVH)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-afrik-data-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # `types: [completed]` fires on failure and cancellation too. Loading the corpus into
    # production after a deploy that did not land would sync data to a version of the
    # application that is not running. A hand-launched run carries no deploy to judge.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The quiz sweep evaluates every fiche against every template, so it is the longest
    # step here by an order of magnitude on a bank it has to build from nothing.
    timeout-minutes: 40
    env:
      # This job runs after a successful OVH production deploy and revalidates
      # ethniafrica.com, so every credential here must be the production project's.
      #
      # It used to hard-code the recette project ref, because the constant it read was
      # named AFRIK_PRODUCTION_SUPABASE_URL while holding the recette ref — so every
      # production deploy loaded the corpus into recette and then busted caches on a site
      # it had not written to. The guard enforced that pairing rather than catching it.
      # resolveAfrikSyncTarget now refuses the combination outright.
      #
      # Both secrets below belong to the project backing PRODUCTION. They are distinct
      # from NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY, which are recette's and
      # are what the rest of CI uses.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      AFRIK_PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_REVALIDATE_SECRET: ${{ secrets.PRODUCTION_REVALIDATE_SECRET }}

    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # The deploy is keyed on a published Release, whose tag can in principle point at a
      # commit that never reached main. Syncing the corpus for such a commit would load a
      # corpus state nobody integrated. A dispatch has no deployed commit to vouch for;
      # the ref it runs on is the operator's own choice, and GitHub only offers refs that
      # exist.
      - name: Verify the deployed commit belongs to main
        if: github.event_name == 'workflow_run'
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git merge-base --is-ancestor "$DEPLOYED_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails rather than skipping. A skipped sync leaves the production corpus stale
      # while the deploy reports success, which is the shape of the defect this workflow
      # just had. A red run on a production deploy is the correct signal that production
      # data is not syncing.
      - name: Require the production project's credentials
        run: |
          : "${NEXT_PUBLIC_SUPABASE_URL:?PRODUCTION_SUPABASE_URL is not set — the AFRIK corpus cannot be synced to production. Set it to the Supabase project backing the production application (not recette).}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?PRODUCTION_SUPABASE_SERVICE_ROLE_KEY is not set — this must be the production project's service-role key, not recette's.}"

      - name: Validate canonical AFRIK sources
        env:
          CHECK_SOURCE_URLS: "false"
        run: npx tsx scripts/validateAfrikData.ts

      # `--conditions=react-server` is load-bearing, not a flag someone added for
      # taste. The loader reaches src/lib/supabase/admin.ts, which imports
      # `server-only`; that package resolves to an empty module under the
      # react-server condition and to a module that throws under any other. Without
      # the flag the sync dies on "This module cannot be imported from a Client
      # Component module" before it reads a single fiche.
      #
      # This never surfaced while the workflow was keyed on a Vercel
      # deployment_status: its `if:` conditions skipped every run, so the job was
      # inert rather than working. Chaining it to the OVH deploy is what made it
      # execute for the first time.
      - name: Preview production synchronization
        run: npx tsx --conditions=react-server scripts/migrateAfrikToDatabase.ts --target=production

      - name: Apply and verify production synchronization
        run: npx tsx --conditions=react-server scripts/migrateAfrikToDatabase.ts --target=production --apply

      # The corpus reaching production is not the quiz reaching production. A question a
      # player sees is a row in `quiz_questions`, and this sweep is the only thing that
      # writes one; the corpus loader above writes none. Nothing ran it here, so the
      # production bank stayed at zero through every release while recette's filled up —
      # and the hub, reading an empty table the way it reads any empty corpus, offered the
      # reader an inert "Bientôt" on a module that was built, deployed and reachable.
      #
      # Idempotent by construction: `computeSweepPlan` skips any (fiche, template) pair
      # that already carries an active question, so running it on every deploy adds what
      # the corpus newly supports and revokes what it no longer does. That is also why it
      # cannot replace an existing question — a change to how questions are *built* still
      # needs the manual `--rebuild` in docs/runbooks/quiz-bank-regeneration.md.
      - name: Generate the production quiz question bank
        run: npx tsx --conditions=react-server scripts/generateQuizQuestions.ts

      # The loader writes its per-fiche failures to a JSON report and only logs
      # the path. On a runner that path is unreachable, so a sync could fail
      # with "completed with errors" and nothing anyone could read — which is
      # exactly how an apply-phase failure stayed undiagnosed while the preview
      # in front of it was clean.
      - name: Upload the loader's error report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afrik-migration-errors-production
          path: dataset/source/afrik/logs/migration_errors_*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Invalidate production AFRIK caches
        if: env.PRODUCTION_REVALIDATE_SECRET != ''
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${PRODUCTION_REVALIDATE_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{"tags":["afrik-language-families","afrik-peoples","afrik-countries"]}' \
            https://ethniafrica.com/api/admin/revalidate
