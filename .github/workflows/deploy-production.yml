name: Deploy Production (OVH)

# Publishing a GitHub Release is the only thing that deploys production.
#
# Not `push: tags`. A tag can be pushed by accident, moved, or created by tooling that
# has no intention of shipping; `release: published` is a deliberate, auditable act with
# a name, notes and an author attached. `/ethniafrica-release` therefore pushes the tag
# first and creates the Release second — the tag alone changes nothing on the VPS.
#
# There is no `workflow_dispatch` here on purpose. A production deploy that can be
# started from a dropdown is a production deploy that happens without a release to point
# at afterwards. Rolling back is a host-side operation, documented in
# docs/runbooks/ovh-production-deploy.md, not a re-run of this workflow.
on:
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Production's schema state used to be a claim in a runbook rather than a
  # measurement. At the 4.1.0 release that claim said production stood at `049`
  # while thirty-two migrations had landed on recette — including the ones that
  # create `afrik_patronymes`, `persons` and every unified-search RPC. Deploying
  # onto that would have shipped a release whose headline features query tables
  # the database does not have.
  #
  # `applied_migrations()` (migration 042) makes the ledger readable over
  # PostgREST, so this is measurable rather than remembered. It runs as its own
  # job so the deploy below keeps carrying an SSH key and nothing else.
  migrate:
    name: Bring production's schema up to the released tag
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # recette's equivalent warns and skips when its secret is absent, which is
      # right for an integration branch. Here it must fail: skipping would hand
      # the deploy below a database that never got the schema, which is the
      # exact outcome this job exists to prevent.
      - name: Require a database URL that points at the tunnel
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: |
          if [ -z "$PRODUCTION_SUPABASE_DB_URL" ]; then
            echo "::error::PRODUCTION_SUPABASE_DB_URL is not set, so migrations cannot be applied. It is a Postgres connection string (postgresql://…), not PRODUCTION_SUPABASE_URL — that one is the PostgREST endpoint and cannot execute DDL. See docs/runbooks/migration-state.md."
            exit 1
          fi

          # The URL carries the postgres password, so it is never echoed. Only the
          # host is extracted: strip the scheme, then the userinfo if present, then
          # everything from the port, path or query onwards.
          HOST=$(printf '%s' "$PRODUCTION_SUPABASE_DB_URL" | sed -E 's#^[a-zA-Z+]+://##; s#^[^@/]*@##; s#[:/?].*$##')
          # A malformed URL can leave a fragment of the password in HOST, which is
          # then not something to print. Anything outside hostname characters is
          # reported as unparseable rather than shown.
          case "$HOST" in
            *[!a-zA-Z0-9.-]*) HOST="(unparseable)" ;;
          esac

          case "$HOST" in
            localhost | 127.0.0.1) ;;
            *)
              echo "::error::PRODUCTION_SUPABASE_DB_URL must point at the tunnel — localhost or 127.0.0.1 — but names $HOST. Production's Postgres is self-hosted on the OVH VPS and its port is not published: measured 2026-09-03, that host answers on 443 and refuses 5432 and 6543, which is why the v4.1.1 deploy read the ledger over PostgREST and then failed with ECONNREFUSED. The SSH forward opened below is the only path to it. See docs/runbooks/migration-state.md."
              exit 1
              ;;
          esac

      # What production holds, before anything is applied. `applied_migrations()`
      # (migration 042) makes this a measurement rather than a claim in a runbook.
      - name: Measure the production ledger
        id: before
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run --silent check:migration-state:production -- --json > before.json || true
          PENDING=$(node -e "const r=require('./before.json');console.log((r.pending||[]).length)")
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "Production has $PENDING pending migration(s)."
          node -e "const r=require('./before.json');for(const m of r.pending||[])console.log('  pending:',m.name||m)"

      - name: Install the Supabase CLI
        if: steps.before.outputs.pending != '0'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      # Production's Postgres is self-hosted on the OVH VPS and deliberately not
      # on the internet. Publishing 5432 to let a runner in would put the
      # production database in front of GitHub's entire address space — the
      # runners have no stable range to restrict to. An SSH forward gives the
      # same reachability to this job alone, and `db push` keeps running on the
      # runner, where the CLI, the migration files and the ledger comparison
      # already are. Only the network path moves.
      #
      # The forward targets 127.0.0.1 rather than localhost on the far side: the
      # compose file publishes the port on IPv4, and `localhost` there can
      # resolve to ::1 first, where nothing listens.
      - name: Open an SSH tunnel to the self-hosted Postgres
        if: steps.before.outputs.pending != '0'
        env:
          SSH_KEY: ${{ secrets.SUPABASE_OVH_SSH_KEY }}
          SSH_HOST: ${{ secrets.SUPABASE_OVH_SSH_HOST }}
          SSH_USER: ${{ secrets.SUPABASE_OVH_SSH_USER }}
          SSH_PORT: ${{ secrets.SUPABASE_OVH_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SUPABASE_OVH_SSH_KNOWN_HOSTS }}
        run: |
          # No apostrophes in these messages: inside ${VAR:?word} bash reads a
          # single quote as opening a quote even within double quotes, and
          # check:workflow-shell fails the file on the unterminated string.
          : "${SSH_KEY:?SUPABASE_OVH_SSH_KEY is not set — the migrate job cannot reach the production Postgres without it. See docs/runbooks/migration-state.md}"
          : "${SSH_HOST:?SUPABASE_OVH_SSH_HOST is not set}"
          : "${SSH_USER:?SUPABASE_OVH_SSH_USER is not set}"
          : "${SSH_PORT:?SUPABASE_OVH_SSH_PORT is not set}"
          : "${SSH_KNOWN_HOSTS:?SUPABASE_OVH_SSH_KNOWN_HOSTS is not set — pinning the host key is what stops this job from forwarding a database credential to whoever answers on that address}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/supabase_tunnel_key
          chmod 600 ~/.ssh/supabase_tunnel_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # -f backgrounds ssh only once the forward is established, and
          # ExitOnForwardFailure makes a refused forward a non-zero exit instead
          # of a tunnel that listens and accepts nothing.
          ssh -f -N \
            -i ~/.ssh/supabase_tunnel_key \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -L 5432:127.0.0.1:5432 \
            "$SSH_USER@$SSH_HOST"

          # ssh returning is not proof the far end accepts a connection, and a
          # refusal must not reach `db push`, which would report it as a schema
          # problem. The port is probed before the plan is allowed to run.
          for _ in $(seq 1 20); do
            if timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/5432' 2>/dev/null; then
              echo "The tunnel is accepting connections on 127.0.0.1:5432."
              exit 0
            fi
            sleep 1
          done
          echo "::error::the SSH tunnel never started listening on 127.0.0.1:5432. If ssh itself connected, the port is probably not published on the VPS loopback — check what the Supabase compose file binds for the db service, and forward that instead."
          exit 1

      # The plan is asserted against the measurement before it runs. A `db push`
      # that intends to replay more than the pending set means the ledger and the
      # files disagree — and replaying from the start reaches
      # `007_remove_v1_add_v2_contribution_types.sql`, which opens with
      # `DROP TABLE IF EXISTS sources CASCADE`. That is not a migration to
      # discover mid-deploy.
      - name: Plan, and refuse a plan wider than the measurement
        if: steps.before.outputs.pending != '0'
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: |
          # Without pipefail the pipe below reports tee's status, not the one
          # from db push. At v4.2.0 the dry run failed to connect, grep matched
          # nothing, `|| true` turned that into 0, and 0 is never greater than
          # the measurement — so this gate passed green having reached no
          # database at all. It only ever caught a plan that was too wide.
          set -o pipefail

          # The tunnel already carries these bytes inside SSH and terminates on
          # the VPS loopback, so Postgres-level TLS adds nothing — and the
          # self-hosted stack does not offer it, which is what "The server does
          # not support SSL connections" meant. A URL that states an sslmode of
          # its own is left alone rather than overridden.
          case "$PRODUCTION_SUPABASE_DB_URL" in
            *sslmode=*) DB_URL="$PRODUCTION_SUPABASE_DB_URL" ;;
            *\?*) DB_URL="$PRODUCTION_SUPABASE_DB_URL&sslmode=disable" ;;
            *) DB_URL="$PRODUCTION_SUPABASE_DB_URL?sslmode=disable" ;;
          esac
          echo "::add-mask::$DB_URL"

          supabase db push --db-url "$DB_URL" --include-all --dry-run | tee plan.txt
          PLANNED=$(grep -cE '^[[:space:]]*[0-9]{3}_[a-z0-9_]+\.sql' plan.txt || true)
          echo "planned=$PLANNED measured=${{ steps.before.outputs.pending }}"

          # This step only runs when migrations are pending, so a plan of none
          # is not a quiet success — it means the dry run did not do what it
          # claimed.
          if [ "$PLANNED" -eq 0 ]; then
            echo "::error::the dry run planned no migrations while ${{ steps.before.outputs.pending }} are pending. It did not reach the database, or its output no longer names migration files the way this gate parses. Refusing to treat that as a clean plan."
            exit 1
          fi

          if [ "$PLANNED" -gt "${{ steps.before.outputs.pending }}" ]; then
            echo "::error::db push plans $PLANNED migrations but only ${{ steps.before.outputs.pending }} are pending. The ledger and the files disagree; repair the ledger by hand before releasing (docs/runbooks/migration-state.md)."
            exit 1
          fi

      - name: Apply the pending migrations
        if: steps.before.outputs.pending != '0'
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: |
          # Same normalisation as the plan step. It is repeated rather than
          # carried across in an output: a step output holding the URL would
          # persist the postgres password in the run, mask or no mask.
          case "$PRODUCTION_SUPABASE_DB_URL" in
            *sslmode=*) DB_URL="$PRODUCTION_SUPABASE_DB_URL" ;;
            *\?*) DB_URL="$PRODUCTION_SUPABASE_DB_URL&sslmode=disable" ;;
            *) DB_URL="$PRODUCTION_SUPABASE_DB_URL?sslmode=disable" ;;
          esac
          echo "::add-mask::$DB_URL"

          supabase db push --db-url "$DB_URL" --include-all

      # Verify by measuring again, never by the tool's own report — the rule the
      # runbook already draws from the 2026-08-31 repair.
      - name: Measure again, and require a clean ledger
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:migration-state:production

  deploy:
    # A pre-release is a release too as far as GitHub is concerned. Shipping `v1.2.0-rc.1`
    # to ethniafrica.com because someone ticked "pre-release" would be a surprise.
    if: github.event.release.prerelease == false
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://ethniafrica.com

    steps:
      # The runner never checks the code out. The VPS holds the clone and builds the
      # image itself, so the only credential this workflow carries is an SSH key — no
      # Supabase keys, no Sentry token, nothing that could leak into a job log.
      - name: Open an SSH session to the OVH VPS
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_OVH_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_OVH_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_OVH_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_OVH_SSH_KNOWN_HOSTS }}
        run: |
          : "${SSH_KEY:?PRODUCTION_OVH_SSH_KEY is not set — see docs/runbooks/ovh-production-deploy.md}"
          : "${SSH_HOST:?PRODUCTION_OVH_SSH_HOST is not set}"
          # sshd does not listen on 22 on this host, and the known_hosts entry is keyed
          # `[host]:port` — a default of 22 would fail host-key verification, not merely
          # fail to connect.
          : "${SSH_PORT:?PRODUCTION_OVH_SSH_PORT is not set}"
          : "${SSH_KNOWN_HOSTS:?PRODUCTION_OVH_SSH_KNOWN_HOSTS is not set — pinning the host key is what stops this job from handing the deploy key to whoever answers on that address}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build and start the release on the VPS
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_OVH_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_OVH_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTION_OVH_SSH_PORT }}
          # github.event.release.tag_name, never github.ref_name: the workflow is keyed
          # on the Release, and this is the tag that Release actually names.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The tag ends up inside a command string interpreted by the remote shell. Git
          # permits characters there that a shell would read as syntax, so it is matched
          # against the shape /ethniafrica-release actually produces rather than trusted.
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to deploy an unexpected tag shape: $RELEASE_TAG"; exit 1 ;;
          esac

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "RELEASE_TAG='$RELEASE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /srv/ethniafrica

          # A detached checkout of the exact released tag. Not `git pull`: that would
          # deploy whatever main has drifted to since the Release was cut, which is the
          # opposite of what publishing a Release is supposed to mean.
          git fetch --tags --force origin
          git checkout --force "$RELEASE_TAG"

          # Name the outgoing image before the build overwrites `:live`, so the rollback
          # in the runbook has something to point at. Only one generation is kept: after
          # two deploys in a row the version before last is gone, and rolling back that
          # far means rebuilding from its tag — the runbook covers both.
          if docker image inspect ethniafrica:live >/dev/null 2>&1; then
            docker image tag ethniafrica:live ethniafrica:previous
          fi

          # BuildKit reads the build_env secret from /srv/ethniafrica/.env, which never
          # leaves the host. compose recreates the container because the image ID behind
          # `:live` changed, even though the tag did not.
          docker compose build ethniafrica
          docker compose up -d --no-deps ethniafrica
          REMOTE

      - name: Wait for the new container to answer
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_OVH_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_OVH_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTION_OVH_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/ethniafrica

          # Polls the container directly rather than the public hostname: this has to
          # report on the deploy, not on DNS, Traefik or a CDN in front of them.
          for attempt in $(seq 1 30); do
            if docker compose exec -T ethniafrica node -e \
                 "fetch('http://127.0.0.1:3000/fr').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "container answered on attempt $attempt"
              exit 0
            fi
            sleep 5
          done

          echo "the new container never answered on /fr — rolling back is a host-side"
          echo "operation, see docs/runbooks/ovh-production-deploy.md"
          docker compose logs --tail=100 ethniafrica
          exit 1
          REMOTE

      - name: Revoke the deploy key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
