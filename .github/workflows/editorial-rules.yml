name: Editorial Rules Gate

on:
  pull_request:
    branches: [main, recette]
  workflow_dispatch:

# The `push` trigger on the same two branches re-ran this gate on merge over an
# identical tree, for the reason ci.yml and data-integrity.yml already state:
# every change reaches them through a pull request, so nothing read the second
# result. Superseded runs are cancelled rather than left to finish.
concurrency:
  group: editorial-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editorial-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Enforces six decolonial-posture rules on AFRIK fiches:
      #   1. autonym required at confidence >= medium (warning otherwise)
      #   2. >= 2 sources when classification_status is contested or
      #      colonial-legacy
      #   3. DoctrineLinkCard snapshot presence — graceful skip when ETNI-28
      #      is not yet merged
      #   4. a patronyme's claims cite sources the fiche itself declares
      #   5. reader-facing register — no repo path, field path, raw identifier
      #      or pipeline vocabulary in the three fields published verbatim
      #   6. chronology symmetry — a country that dates its colonial
      #      administrations dates its precolonial polities, held by a
      #      two-way ratchet on UNDATED_POLITY_CEILING
      # PR annotations are emitted on stdout in GitHub Actions
      # workflow-command format.
      - name: Run editorial-rules gate
        run: npx tsx scripts/ci/checkEditorialRules.ts
