# Supabase local development configuration
# https://supabase.com/docs/guides/local-development

[api]
port = 54321

[db]
port = 5432

[studio]
port = 54323

# Inbucket email server — captures outbound emails during local dev/testing
[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

# -------------------------------------------------------------------
# Auth — one magic link, to an allowlisted address, and nothing else
# -------------------------------------------------------------------
# There are no public accounts: reporting costs none (moderation charter §2),
# and the only sign-in surface is /fr/admin/connexion, which mails a link to an
# address on `admin_allowlist`. So there is no provider to federate with and no
# sign-up to configure.
[auth]
enabled = true

# The fallback, and only the fallback: GoTrue uses this when a requested
# redirect is not in the allow-list below. Every legitimate redirect now
# matches, so it should never fire — which is exactly the reasoning that let it
# sit on a dead Vercel deployment unnoticed, so it is set to somewhere real.
#
# It names the recette domain rather than localhost because this file is what
# `supabase config push` sends to the recette project, and a shared environment
# falling back to a developer's machine is worse than a developer's machine
# falling back to recette.
site_url = "https://recette.africatlas.com"

# **Every entry must carry the callback path.**
#
# `http://localhost:3000` alone does not match
# `http://localhost:3000/api/auth/callback`, and a redirect that does not match
# is not an error: GoTrue silently substitutes `site_url`. That is the whole
# reason magic links arrived pointing at a stale Vercel deployment — the
# application asked for the right URL and was quietly given another.
#
# Applying this to a hosted project is `supabase config push` against that
# project, or the same values typed into Authentication → URL Configuration.
# Production is self-hosted and reads `ADDITIONAL_REDIRECT_URLS` from
# `/home/ubuntu/supabase/docker/.env` instead — see
# docs/runbooks/moderation-access.md.
additional_redirect_urls = [
  "http://localhost:3000/api/auth/callback",
  "https://recette.africatlas.com/api/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
# The allowlist is the gate, so an authorized person need not have registered
# first: `signInWithOtp` is called with `shouldCreateUser: true` and the account
# it creates carries no privilege of its own.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# GitHub and Google are deliberately off.
#
# Both used to be offered on two separate sign-in pages. They authenticated a
# person the atlas had no use for — a public account bought attribution nobody
# needed and follow-up the public slug already provided — and after this change
# they would open a second door onto the same allowlist check, failing for
# everyone not on it. A choice that changes nothing is worse than no choice.
[auth.external.github]
enabled = false

[auth.external.google]
enabled = false
